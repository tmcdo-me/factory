# The Factory server on one Fly.io Machine: an option, untested (the homelab's compose stack is where it
# runs; nothing here has run on Fly). An example: set `app` and `primary_region`, then from the
# repository root
#
#   fly deploy . --config fork/deploy/fly.toml \
#     --dockerfile fork/deploy/Dockerfile --ignorefile fork/deploy/Dockerfile.dockerignore
#
# The build context is the repository root (the `.`); the flags name the Dockerfile and its ignore
# file relative to it, whatever flyctl makes of the relative paths under [build].
# Secrets come from `fly secrets set` (fork/deploy/README.md, "Fly.io"), never from this file.
# One Machine only: the database is a libSQL file on the Machine's volume, which one process may open.
app = "factory-example"
primary_region = "ord"
# Factory's shutdown on SIGTERM drains requests, stops Claude Code and the dispatcher and closes the
# database; give it this long before the Machine is killed.
kill_signal = "SIGTERM"
kill_timeout = 60

[build]
dockerfile = "Dockerfile"
ignorefile = "Dockerfile.dockerignore"

[env]
# The image sets the rest (FACTORY_DEPLOYMENT=container, FACTORY_SANDBOX_PROVIDER=sprites,
# FACTORY_DATABASE=libsql, the data paths under /data, PORT=5873).
TZ = "America/Chicago"
# The URL people open. Fly's default name, or a custom domain; the OIDC client's redirect URI is
# <this>/auth/callback and the GitHub App's callback <this>/auth/github/callback.
MASTRACODE_PUBLIC_URL = "https://factory-example.fly.dev"
# Fly regions are not Sprites regions; leave unset for the Sprites default, or pick one near the app.
FACTORY_SPRITES_REGION = "ord"

# /data holds the database and its snapshots. A new Fly volume is root's; the image's entrypoint gives it
# to the server's user on first start. A Fly volume is local NVMe on the Machine's host, which
# SQLite needs (no network filesystem). Fly also snapshots volumes daily (crash-consistent; SQLite in
# WAL mode recovers from that state); `factory-snapshot` makes the checked copy (README).
[mounts]
source = "factory_data"
destination = "/data"
initial_size = "3gb"
snapshot_retention = 14

[http_service]
internal_port = 5873
force_https = true
# The dispatcher, Slack's socket and live Claude Code sessions run in the background: the Machine
# must keep running with no request in flight.
auto_stop_machines = "off"
auto_start_machines = false
min_machines_running = 1

[http_service.concurrency]
type = "requests"
soft_limit = 200
hard_limit = 250

[[http_service.checks]]
grace_period = "60s"
interval = "30s"
timeout = "5s"
method = "GET"
path = "/auth/me"

[[vm]]
size = "shared-cpu-2x"
memory = "2gb"
